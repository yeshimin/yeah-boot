server:
  port: 8080

spring:
  profiles:
    # 默认激活dev
    active: dev
  application:
    name: yeah-admin
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# for actuator, health endpoint
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 接口文档相关
springdoc:
  swagger-ui:
    path: /doc.html

# dataSource decorator by p6spy
# https://baomidou.com/guides/p6spy/
# https://github.com/gavlyukovskiy/spring-boot-data-source-decorator
decorator:
  datasource:
    p6spy:
      # Register P6LogFactory to log JDBC events
      enable-logging: true
      # Custom log format, if specified com.p6spy.engine.spy.appender.CustomLineFormat will be used with this log format
      # see https://p6spy.readthedocs.io/en/latest/configandusage.html#customlogmessageformat
      log-format: "id: %(connectionId) | t: %(currentTime) | d: %(executionTime)ms | c: %(category) | sql: \n\t%(sqlSingleLine)"
      # Exclude certain categories from logging. If specified only matched messages will be logged.
      # see https://p6spy.readthedocs.io/en/latest/configandusage.html#excludecategories
      exclude-categories: "info,debug,result,resultset,commit,rollback"

# mybatis-plus相关
mybatis-plus:
  global-config:
    db-config:
      # 实体查询时，字段为非空串才设置查询条件
      select-strategy: not_empty

yeah-boot:
  # 跨域默认关闭；业务项目按环境配置启用并指定来源白名单。详细配置见CorsProperties类
  cors:
    enabled: false
  # 是否为安全模式（场景：跳过@PreAuthorize @pms.hasPermission权限校验，方便权限配置或其他场景；一般为false，不需要动）
  safe-mode: false
  # 超级管理员账号，该账号可以跳过权限校验
  super-admin: ''
  # ID编号生成器
  id-generator:
    alphabet: GQT0FNR3taz1vDVEjsSJ2biZmLB8qk6OCMndohlKf4IAw7xr9eYgXWPcuHpU5y
    min-length: 8
  # 代码生成器
  code-generator:
    url: ${spring.datasource.url}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}
    author: yeshimin
    pack: com.yeshimin.yeahboot
    module: admin
    table-prefix:
      - t_
      - s_
    base-entity-fields:
      - id
      - deleteTime
      - deleted
      - createTime
      - createBy
      - updateTime
      - updateBy
  # Websocket相关
  websocket:
    heartbeat:
      # 是否启用心跳检测
      enabled: false
      # 心跳检测间隔（秒）
      interval: 30
      # 心跳检测超时时间（秒）
      timeout: 90
  # api加解密相关【管理端已支持，app端暂未支持】
  encryption:
    # OFF、OPTIONAL、REQUIRED；未配置环境变量时保持关闭
    mode: ${YEAH_BOOT_API_ENCRYPTION_MODE:OFF}
    # 当前内置的国密加密套件。
    suite: ${YEAH_BOOT_API_ENCRYPTION_SUITE:sm2-sm4-gcm-v1}
    # 当前 API 加密协议版本，仅支持 1。
    version: ${YEAH_BOOT_API_ENCRYPTION_VERSION:1}
    # 当前服务端密钥标识；更换密钥时应同步更新。
    key-id: ${YEAH_BOOT_API_ENCRYPTION_KEY_ID:default}
    # 始终保持明文的接口规则，格式为“路径 [HTTP方法]”；空列表表示不额外豁免。
    bypass-routes: []
    # 请求时间戳允许偏差，单位：秒。
    timestamp-window-seconds: ${YEAH_BOOT_API_ENCRYPTION_TIMESTAMP_WINDOW_SECONDS:300}
    # 防重放 nonce 缓存有效期，单位：秒；不能小于 timestamp-window-seconds。
    replay-ttl-seconds: ${YEAH_BOOT_API_ENCRYPTION_REPLAY_TTL_SECONDS:300}
    # 单个加密请求密文最大字节数。
    max-payload-bytes: ${YEAH_BOOT_API_ENCRYPTION_MAX_PAYLOAD_BYTES:65536}
    # 仅允许通过环境变量注入，不能写入版本控制的配置文件
    private-key: ${YEAH_BOOT_API_ENCRYPTION_PRIVATE_KEY:}
